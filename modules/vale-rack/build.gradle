plugins { id 'java'; id 'com.gtnewhorizons.retrofuturagradle' version '2.0.3' }
group='village.valerack'
version='0.1.1'
java { toolchain { languageVersion.set(JavaLanguageVersion.of(8)); vendor.set(JvmVendorSpec.AZUL) } }
minecraft { mcVersion.set('1.12.2'); mcpMappingChannel.set('stable'); mcpMappingVersion.set('39'); username.set('ValeRackBuilder') }
apply from: file('../../gradle/vale-compile-inputs.gradle')
dependencies { compileOnly files(valeCompileInput('valeCoreDevJar', 'Current Vale Core development API')) }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.incremental=false }
tasks.named('jar') { archiveBaseName.set('Vale-Rack') }

apply from: file('../../gradle/vale-mod-build.gradle')
