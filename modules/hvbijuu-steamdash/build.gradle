plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.3'
}
// Steam Dash Punch: original overlay classes. They are added to the owner's private Bijuu Armor jar by assemble.py; that jar is never committed.
version = '1'
java { toolchain { languageVersion.set(JavaLanguageVersion.of(8)); vendor.set(JvmVendorSpec.AZUL) } }
minecraft { mcVersion.set('1.12.2'); mcpMappingChannel.set('stable'); mcpMappingVersion.set('39') }
sourceSets.main.java.srcDirs = ['src']
sourceSets.main.resources.srcDirs = ['resources']
dependencies {
    // Only hvbijuu's own class/member names are used, which are not obfuscated, so the release jar works as-is.
    compileOnly files(providers.gradleProperty('hvbJar').get())
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
