plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.3'
}
group = 'village.fieldhud'
version = '0.18.0'
base { archivesName = 'field-hud' }
java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(8))
        vendor.set(JvmVendorSpec.AZUL)
    }
    withSourcesJar()
}
minecraft {
    mcVersion.set('1.12.2')
    mcpMappingChannel.set('stable')
    mcpMappingVersion.set('39')
    username.set('FieldHudTest')
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
// Keep headless checks bounded while a full modded client/server is running.
tasks.withType(JavaExec).matching { it.name.startsWith('verify') }.configureEach { maxHeapSize = '512m' }
def holdClasses = layout.buildDirectory.dir('hold-checks')
tasks.register('compileHoldChecks', JavaCompile) {
    source files('src/main/java/village/fieldhud/HoldGesture.java', 'tests/village/fieldhud/HoldGestureChecks.java')
    classpath = files()
    destinationDirectory = holdClasses
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(8) }
}
tasks.register('verifyCombatHold', JavaExec) {
    dependsOn 'compileHoldChecks'
    classpath = files(holdClasses)
    mainClass = 'village.fieldhud.HoldGestureChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
}
tasks.named('check') { dependsOn 'verifyCombatHold' }
jar { from('LICENSE.txt') }
// Optional local compile shortcut. The supplied JAR must be an independently
// prepared, deobfuscated Forge 1.12.2 stable-39 development API, never a mod JAR.
// Fresh external builds omit this property and use the normal RFG pipeline.

apply from: file('../../gradle/vale-mod-build.gradle')

// Naruto settings/inventory geometry and rebinding gesture checks, independent of Minecraft.
def narutoMenuClasses = layout.buildDirectory.dir('naruto-menu-checks')
tasks.register('compileNarutoMenuChecks', JavaCompile) {
    source files('src/main/java/village/fieldhud/Layout.java', 'src/main/java/village/fieldhud/NarutoMenuLayout.java', 'src/main/java/village/fieldhud/InventoryThemeLayout.java', 'src/main/java/village/fieldhud/TrainingGrade.java', 'src/main/java/village/fieldhud/RebindGesture.java', 'tests/village/fieldhud/NarutoMenuChecks.java')
    classpath = files()
    destinationDirectory = narutoMenuClasses
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(8) }
}
tasks.register('verifyNarutoMenus', JavaExec) {
    dependsOn 'compileNarutoMenuChecks'
    classpath = files(narutoMenuClasses)
    mainClass = 'village.fieldhud.NarutoMenuChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
}
tasks.named('check') { dependsOn 'verifyNarutoMenus' }

// Fresh release coordinates delegate to the native private slot lookup, not the drawn hover cache.
def freshSlotClasses = layout.buildDirectory.dir('fresh-slot-checks')
tasks.register('compileFreshSlotLookupChecks', JavaCompile) {
    source files('src/main/java/village/fieldhud/FreshSlotLookup.java', 'tests/village/fieldhud/FreshSlotLookupChecks.java')
    classpath = files()
    destinationDirectory = freshSlotClasses
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(8) }
}
tasks.register('verifyFreshSlotLookup', JavaExec) {
    dependsOn 'compileFreshSlotLookupChecks'
    classpath = files(freshSlotClasses)
    mainClass = 'village.fieldhud.FreshSlotLookupChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
}
tasks.named('check') { dependsOn 'verifyFreshSlotLookup' }

def sharedResourceClasses = layout.buildDirectory.dir('shared-resource-checks')
tasks.register('compileSharedResourceChecks', JavaCompile) {
    source files('src/main/java/village/fieldhud/SharedResourceReader.java', 'src/main/java/village/fieldhud/ReadinessLine.java', 'tests/village/fieldhud/SharedResourceChecks.java')
    classpath = files()
    destinationDirectory = sharedResourceClasses
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(8) }
}
tasks.register('verifySharedResourceHud', JavaExec) {
    dependsOn 'compileSharedResourceChecks'
    classpath = files(sharedResourceClasses)
    mainClass = 'village.fieldhud.SharedResourceChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
}
tasks.named('check') { dependsOn 'verifySharedResourceHud' }
