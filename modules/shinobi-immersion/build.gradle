plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.3'
}
group = 'village.immersion'
version = '0.2.0'
base { archivesName = 'shinobi-immersion' }
java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(8))
        vendor.set(JvmVendorSpec.AZUL)
    }
    withSourcesJar()
}
minecraft {
    mcVersion.set('1.12.2')
    mcpMappingChannel.set('stable')
    mcpMappingVersion.set('39')
    username.set('ImmersionTest')
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Pure movement and sound rules, independent of Minecraft.
def immersionClasses = layout.buildDirectory.dir('immersion-checks')
tasks.register('compileImmersionChecks', JavaCompile) {
    source files('src/main/java/village/immersion/ImmersionMath.java', 'tests/village/immersion/ImmersionChecks.java')
    classpath = files()
    destinationDirectory = immersionClasses
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(8) }
}
tasks.register('verifyImmersion', JavaExec) {
    dependsOn 'compileImmersionChecks'
    classpath = files(immersionClasses)
    mainClass = 'village.immersion.ImmersionChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
}
tasks.named('check') { dependsOn 'verifyImmersion' }

apply from: file('../../gradle/vale-mod-build.gradle')
