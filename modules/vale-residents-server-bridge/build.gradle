plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.3'
}
group='village.residentsbridge'
version='0.1.0'
base { archivesName='vale-residents-server-bridge' }
java { toolchain {languageVersion.set(JavaLanguageVersion.of(8));vendor.set(JvmVendorSpec.AZUL)} }
minecraft {mcVersion.set('1.12.2');mcpMappingChannel.set('stable');mcpMappingVersion.set('39')}
dependencies {compileOnly files(providers.gradleProperty('residentApiJar').get())}
tasks.withType(JavaCompile).configureEach {options.encoding='UTF-8'}
