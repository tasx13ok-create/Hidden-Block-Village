plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.3'
}
group = 'village.residents'
version = '0.2.1'
base { archivesName = 'vale-residents' }
java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(8))
        vendor.set(JvmVendorSpec.AZUL)
    }
    withSourcesJar()
}
minecraft {
    mcVersion.set('1.12.2')
    mcpMappingChannel.set('stable')
    mcpMappingVersion.set('39')
    username.set('ResidentDeveloper')
}
apply from: file('../../gradle/vale-compile-inputs.gradle')
dependencies { compileOnly files(valeCompileInput('valeCoreDevJar', 'Current Vale Core development API', 'valeApiJar')) }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.incremental = false
}
sourceSets {
    residentChecks {
        java.srcDirs = ['tests']
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}
tasks.register('verifyResidents', JavaExec) {
    dependsOn tasks.named('residentChecksClasses')
    classpath = sourceSets.residentChecks.runtimeClasspath
    mainClass.set('village.residents.ResidentChecks')
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion.set(JavaLanguageVersion.of(8))
        vendor.set(JvmVendorSpec.AZUL)
    })
}
tasks.named('check') { dependsOn tasks.named('verifyResidents') }

tasks.register('verifyDialogue', JavaExec) {
    dependsOn tasks.named('residentChecksClasses')
    classpath = sourceSets.residentChecks.runtimeClasspath
    mainClass.set('village.residents.DialogueChecks')
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion.set(JavaLanguageVersion.of(8))
        vendor.set(JvmVendorSpec.AZUL)
    })
}
tasks.named('check') { dependsOn tasks.named('verifyDialogue') }

apply from: file('../../gradle/vale-mod-build.gradle')
