plugins { id 'java'; id 'com.gtnewhorizons.retrofuturagradle' version '2.0.3' }
group='village.vale'; version='0.1.0'
base { archivesName='naruto-arenas' }
java { toolchain { languageVersion.set(JavaLanguageVersion.of(8)); vendor.set(JvmVendorSpec.AZUL) }; withSourcesJar() }
minecraft { mcVersion.set('1.12.2'); mcpMappingChannel.set('stable'); mcpMappingVersion.set('39') }
apply from: file('../../gradle/vale-compile-inputs.gradle')
dependencies { compileOnly files(valeCompileInput('valeCoreDevJar','Current accepted Vale Core API')) }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.incremental=false }
sourceSets { checks { java.srcDirs=['tests']; compileClasspath+=sourceSets.main.output+sourceSets.main.compileClasspath; runtimeClasspath+=output+compileClasspath } }
tasks.register('verifyArenaRules',JavaExec) { dependsOn tasks.named('checksClasses'); classpath=sourceSets.checks.runtimeClasspath; mainClass.set('village.vale.arenas.RunRulesChecks'); javaLauncher.set(javaToolchains.launcherFor { languageVersion.set(JavaLanguageVersion.of(8)); vendor.set(JvmVendorSpec.AZUL) }) }
tasks.named('check') { dependsOn tasks.named('verifyArenaRules') }
apply from: file('../../gradle/vale-mod-build.gradle')
sourceSets { nativeChecks { java.srcDirs=['nativechecks']; compileClasspath+=sourceSets.main.output+sourceSets.main.compileClasspath; runtimeClasspath+=output+compileClasspath } }
def qaJar=tasks.register('nativeChecksJar',Jar) { dependsOn tasks.named('nativeChecksClasses'); from sourceSets.nativeChecks.output; archiveBaseName.set('PRIVATE-naruto-arenas-checks'); archiveClassifier.set('dev'); destinationDirectory.set(layout.buildDirectory.dir('private-native-checks')) }
def productionReobf=tasks.named('reobfJar',com.gtnewhorizons.retrofuturagradle.mcp.ReobfuscatedJar)
tasks.register('reobfNativeChecksJar',com.gtnewhorizons.retrofuturagradle.mcp.ReobfuscatedJar) {
 dependsOn productionReobf; setInputJarFromTask(qaJar); archiveBaseName.set('PRIVATE-naruto-arenas-checks'); archiveClassifier.set(''); destinationDirectory.set(layout.buildDirectory.dir('private-native-checks'))
 mcVersion.set(productionReobf.flatMap { it.mcVersion }); srg.set(productionReobf.flatMap { it.srg }); fieldCsv.set(productionReobf.flatMap { it.fieldCsv }); methodCsv.set(productionReobf.flatMap { it.methodCsv }); exceptorCfg.set(productionReobf.flatMap { it.exceptorCfg }); recompMcJar.set(productionReobf.flatMap { it.recompMcJar }); extraSrgEntries.set(productionReobf.flatMap { it.extraSrgEntries }); extraSrgFiles.from(productionReobf.map { it.extraSrgFiles }); referenceClasspath.from(sourceSets.nativeChecks.compileClasspath)
}
