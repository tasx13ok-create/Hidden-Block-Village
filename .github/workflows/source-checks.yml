name: Source component checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-tools:
    name: Release tools (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.8'
          - os: windows-latest
            python: '3.12'
          - os: windows-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: '8'
      - name: Release and bootstrap regression checks
        env:
          VALE_JAVA8_HOME: ${{ env.JAVA_HOME }}
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: PC companion file and relay checks
        working-directory: tools/pc_companion
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: PC companion Windows ABI and desktop guard checks
        working-directory: tools/pc_companion
        run: python -m unittest -v test_vale_windows

  source-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: '8'
      - name: Retain the Minecraft compiler path
        run: echo "VALE_JAVA8_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: '25'
      - name: Build declared source components
        timeout-minutes: 45
        run: python tools/build_modules.py
      - name: Run private Forge runtime checks
        timeout-minutes: 40
        run: python tools/run_native_checks.py
      - name: Upload component reports and checked source-built outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-components-${{ github.sha }}
          path: |
            build/source-build-report.json
            build/source-builds/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload native reports and logs only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-checks-${{ github.sha }}
          path: |
            build/native-check-report.json
            build/native-checks/*/report.json
            build/native-checks/*/native-recovery039-result.json
            build/native-checks/*/*.log
          if-no-files-found: warn
          retention-days: 14
